<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stub · links, printed short</title>
    <meta name="description" content="A link shortener that prints you a ticket. Paste a long URL, get a short stub to tear off and share." />
    <meta property="og:title" content="stub · links, printed short" />
    <meta property="og:description" content="Paste a long URL. Get a stamped ticket and a short stub to tear off and share." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#EEEDE8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1A17" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
    />
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        var t = JSON.parse(localStorage.getItem('stub.theme'));
      } catch (e) {}
      document.documentElement.dataset.theme =
        t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
